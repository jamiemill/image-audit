<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Audit Browser</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #212529;
        }
        header {
            background-color: #fff;
            padding: 1rem 2rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        #status { font-style: italic; color: #6c757d; }
        main { padding: 2rem; }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 0 1rem rgba(0,0,0,0.05);
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
            vertical-align: middle;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        td:nth-child(3), td:nth-child(4) { white-space: normal; word-break: break-all; }
        th { background-color: #f8f9fa; font-weight: 600; }
        tbody tr:hover { background-color: #f1f3f5; }
        tbody tr.selected-row { background-color: #dbeafe; }
        td.thumbnail-cell img { max-width: 100px; max-height: 100px; border-radius: 4px; display: block; }
        .similarity-link { color: #007bff; text-decoration: underline; cursor: pointer; }
        #sidebar {
            position: fixed; top: 0; right: 0; width: 60%; height: 100%;
            background-color: #fff; box-shadow: -0.5rem 0 1.5rem rgba(0,0,0,0.15);
            transform: translateX(100%); transition: transform 0.3s ease-in-out;
            overflow-y: auto; z-index: 200;
        }
        #sidebar.visible { transform: translateX(0); }
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; border-bottom: 1px solid #dee2e6;
            position: sticky; top: 0; background: #fff;
        }
        .sidebar-header h2 { margin: 0; }
        #close-sidebar { font-size: 1.5rem; font-weight: bold; cursor: pointer; border: none; background: none; }
        .sidebar-content { padding: 2rem; }
        #sidebar-source-image {
            display: flex;
            gap: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #e9ecef;
            margin-bottom: 1.5rem;
        }
        #sidebar-source-image img {
            max-width: 150px;
            max-height: 150px;
            border-radius: 4px;
        }
        #sidebar-source-image ul {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
        }
        #sidebar-source-image li { margin-bottom: 0.5rem; }
        #sidebar-source-image li strong { color: #495057; }
        #filter-bar {
            background-color: #f1f3f5;
            padding: 1rem 2rem;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }
        .filter-group { display: flex; flex-direction: column; gap: 0.25rem; }
        .filter-group label { font-size: 0.8rem; font-weight: 500; color: #495057; }
        .filter-group input, .filter-group select { 
            padding: 0.375rem 0.75rem;
            font-size: 0.9rem;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
        }
        .filter-group.range-group { flex-direction: row; align-items: center; gap: 0.5rem; }
        .filter-group.range-group input { width: 60px; }
        #filter-buttons { margin-left: auto; display: flex; gap: 0.5rem; }
        #filter-buttons button {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 0.25rem;
            border: 1px solid transparent;
            cursor: pointer;
        }
        #apply-filters { background-color: #007bff; color: white; border-color: #007bff; }
        #reset-filters { background-color: #6c757d; color: white; border-color: #6c757d; }
    </style>
</head>
<body>

    <header><h1>Image Audit Browser</h1><div id="status">Loading...</div></header>

    <div id="filter-bar">
        <div class="filter-group"><label for="drive-filter">Drive</label><select id="drive-filter"></select></div>
        <div class="filter-group"><label for="type-filter">Type</label><select id="type-filter"></select></div>
        <div class="filter-group"><label for="path-filter">Path Contains</label><input type="text" id="path-filter"></div>
        <div class="filter-group"><label for="filename-filter">Filename Contains</label><input type="text" id="filename-filter"></div>
        <div class="filter-group range-group"><label>Size(KB):</label><input type="number" id="size-gt-filter" placeholder=">"> <input type="number" id="size-lt-filter" placeholder="<"></div>
        <div class="filter-group range-group"><label>Width:</label><input type="number" id="width-gt-filter" placeholder=">"> <input type="number" id="width-lt-filter" placeholder="<"></div>
        <div class="filter-group range-group"><label>Height:</label><input type="number" id="height-gt-filter" placeholder=">"> <input type="number" id="height-lt-filter" placeholder="<"></div>
        <div class="filter-group range-group"><label>Similar:</label><input type="number" id="similar-gt-filter" placeholder=">"> <input type="number" id="similar-lt-filter" placeholder="<"></div>
        <div id="filter-buttons"><button id="reset-filters">Reset</button><button id="apply-filters">Apply</button></div>
    </div>

    <main><table id="main-table"><thead><tr id="main-table-header"></tr></thead><tbody id="main-table-body"></tbody></table></main>

    <aside id="sidebar"><div class="sidebar-header"><h2>Similar to...</h2><button id="close-sidebar">&times;</button></div><div class="sidebar-content" id="sidebar-content"><div id="sidebar-source-image"></div><div id="sidebar-similar-list"></div></div></aside>

    <script>
        const TSV_PATH = 'scanned-media/output.tsv';
        const THUMBNAILS_DIR = 'scanned-media/thumbnails';
        const SIMILARITY_THRESHOLD = 4;

        let fullDataset = [];
        let similarityMap = new Map();
        let tableHeaders = [];

        document.addEventListener('DOMContentLoaded', main);

        async function main() {
            const statusEl = document.getElementById('status');
            try {
                statusEl.textContent = 'Fetching and parsing data...';
                const response = await fetch(TSV_PATH);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const tsvText = await response.text();
                const { headers, data } = parseTsv(tsvText);
                fullDataset = data;
                tableHeaders = headers;

                statusEl.textContent = 'Calculating similarities...';
                setTimeout(() => {
                    similarityMap = calculateAllSimilarities(fullDataset);
                    populateFilterControls(fullDataset);
                    renderMainTable(fullDataset);
                    setupEventListeners();
                    statusEl.textContent = `Loaded and analyzed ${fullDataset.length} images.`;
                }, 10);
            } catch (error) {
                console.error('Error loading data:', error);
                statusEl.textContent = `Error: ${error.message}. Make sure a local server is running.`;
            }
        }

        function parseTsv(tsvText) {
            const lines = tsvText.trim().split('\n');
            const headers = lines.shift().split('\t');
            const data = lines.map(line => {
                const values = line.split('\t');
                const row = {};
                headers.forEach((header, i) => { row[header] = values[i]; });
                return row;
            });
            return { headers, data };
        }

        function hammingDistance(hex1, hex2) {
            if (!hex1 || !hex2 || hex1.length !== hex2.length) return Infinity;
            const bigInt1 = BigInt(`0x${hex1}`);
            const bigInt2 = BigInt(`0x${hex2}`);
            let xorResult = bigInt1 ^ bigInt2;
            let distance = 0;
            while (xorResult > 0) {
                distance += Number(xorResult & 1n);
                xorResult >>= 1n;
            }
            return distance;
        }

        function calculateAllSimilarities(data) {
            const simMap = new Map();
            data.forEach(item => simMap.set(item.FullPath, []));
            const hashIndex = data.reduce((acc, item) => {
                if (item.PerceptualHash) {
                    if (!acc[item.PerceptualHash]) acc[item.PerceptualHash] = [];
                    acc[item.PerceptualHash].push(item);
                }
                return acc;
            }, {});
            const uniqueHashes = Object.keys(hashIndex);
            for (let i = 0; i < uniqueHashes.length; i++) {
                for (let j = i; j < uniqueHashes.length; j++) {
                    const hashA = uniqueHashes[i];
                    const hashB = uniqueHashes[j];
                    const distance = hammingDistance(hashA, hashB);
                    if (distance <= SIMILARITY_THRESHOLD) {
                        const itemsA = hashIndex[hashA];
                        const itemsB = hashIndex[hashB];
                        itemsA.forEach(itemA => {
                            itemsB.forEach(itemB => {
                                if (itemA.FullPath !== itemB.FullPath) {
                                    simMap.get(itemA.FullPath).push({ ...itemB, distance });
                                    simMap.get(itemB.FullPath).push({ ...itemA, distance });
                                }
                            });
                        });
                    }
                }
            }
            for (const key of simMap.keys()) {
                const similarItems = simMap.get(key);
                const uniqueSimilarItems = Array.from(new Map(similarItems.map(item => [item.FullPath, item])).values());
                uniqueSimilarItems.sort((a, b) => a.distance - b.distance);
                simMap.set(key, uniqueSimilarItems);
            }
            return simMap;
        }

        function populateFilterControls(data) {
            const driveSet = new Set();
            const typeSet = new Set();
            data.forEach(row => {
                driveSet.add(row.DriveName);
                typeSet.add(row.FileType);
            });
            const driveFilter = document.getElementById('drive-filter');
            const typeFilter = document.getElementById('type-filter');
            driveFilter.innerHTML = '<option value="">All Drives</option>' + [...driveSet].sort().map(d => `<option value="${d}">${d}</option>`).join('');
            typeFilter.innerHTML = '<option value="">All Types</option>' + [...typeSet].sort().map(t => `<option value="${t}">${t}</option>`).join('');
        }

        function applyFilters() {
            const filters = {
                drive: document.getElementById('drive-filter').value,
                type: document.getElementById('type-filter').value,
                path: document.getElementById('path-filter').value.toLowerCase(),
                filename: document.getElementById('filename-filter').value.toLowerCase(),
                sizeGt: parseFloat(document.getElementById('size-gt-filter').value),
                sizeLt: parseFloat(document.getElementById('size-lt-filter').value),
                widthGt: parseInt(document.getElementById('width-gt-filter').value),
                widthLt: parseInt(document.getElementById('width-lt-filter').value),
                heightGt: parseInt(document.getElementById('height-gt-filter').value),
                heightLt: parseInt(document.getElementById('height-lt-filter').value),
                similarGt: parseInt(document.getElementById('similar-gt-filter').value),
                similarLt: parseInt(document.getElementById('similar-lt-filter').value),
            };
            const filteredData = fullDataset.filter(row => {
                const similarCount = similarityMap.get(row.FullPath)?.length || 0;
                if (filters.drive && row.DriveName !== filters.drive) return false;
                if (filters.type && row.FileType !== filters.type) return false;
                if (filters.path && !row.FullPath.toLowerCase().includes(filters.path)) return false;
                if (filters.filename && !row.FileName.toLowerCase().includes(filters.filename)) return false;
                if (!isNaN(filters.sizeGt) && parseFloat(row.FileSizeKB) <= filters.sizeGt) return false;
                if (!isNaN(filters.sizeLt) && parseFloat(row.FileSizeKB) >= filters.sizeLt) return false;
                if (!isNaN(filters.widthGt) && parseInt(row.Width) <= filters.widthGt) return false;
                if (!isNaN(filters.widthLt) && parseInt(row.Width) >= filters.widthLt) return false;
                if (!isNaN(filters.heightGt) && parseInt(row.Height) <= filters.heightGt) return false;
                if (!isNaN(filters.heightLt) && parseInt(row.Height) >= filters.heightLt) return false;
                if (!isNaN(filters.similarGt) && similarCount <= filters.similarGt) return false;
                if (!isNaN(filters.similarLt) && similarCount >= filters.similarLt) return false;
                return true;
            });
            renderMainTable(filteredData);
            document.getElementById('status').textContent = `Showing ${filteredData.length} of ${fullDataset.length} images.`;
        }

        function renderMainTable(data) {
            const tableHeader = document.getElementById('main-table-header');
            const tableBody = document.getElementById('main-table-body');
            const excludedColumns = new Set(['DateTime', 'Copyright', 'Artist', 'Software', 'ImageDescription', 'Keywords', 'PerceptualHash']);
            const filteredHeaders = tableHeaders.filter(h => !excludedColumns.has(h));
            const displayHeaders = ['Thumbnail', ...filteredHeaders, 'Similar Images'];
            tableHeader.innerHTML = displayHeaders.map(h => `<th>${h}</th>`).join('');
            const rowsHtml = data.map(row => {
                const similarCount = similarityMap.get(row.FullPath)?.length || 0;
                const similarCountDisplay = similarCount > 0 ? `<a href="#" class="similarity-link" data-path="${row.FullPath}">${similarCount}</a>` : '0';
                const thumbnailCell = `<td class="thumbnail-cell"><img src="${THUMBNAILS_DIR}/${row.PerceptualHash}.jpg" alt="thumbnail" loading="lazy"></td>`;
                const dataCells = filteredHeaders.map(header => `<td>${row[header]}</td>`).join('');
                const similarCell = `<td>${similarCountDisplay}</td>`;
                return `<tr data-row-path="${row.FullPath}">${thumbnailCell}${dataCells}${similarCell}</tr>`;
            }).join('');
            tableBody.innerHTML = rowsHtml;
        }

        function renderSourceImageDetails(container, sourceImage) {
            container.innerHTML = `
                <img src="${THUMBNAILS_DIR}/${sourceImage.PerceptualHash}.jpg" alt="Source thumbnail">
                <div>
                    <ul>
                        <li><strong>File:</strong> ${sourceImage.FileName}</li>
                        <li><strong>Path:</strong> ${sourceImage.FullPath}</li>
                        <li><strong>Drive:</strong> ${sourceImage.DriveName}</li>
                    </ul>
                </div>
            `;
        }

        function renderSimilarTable(container, sourceImage, similarImages) {
            const trulySimilar = similarImages.filter(img => img.FullPath !== sourceImage.FullPath);
            if (!trulySimilar || trulySimilar.length === 0) {
                container.innerHTML = '<p>No other similar images found.</p>';
                return;
            }
            const excludedColumns = new Set(['DateTime', 'Copyright', 'Artist', 'Software', 'ImageDescription', 'Keywords', 'PerceptualHash']);
            const filteredHeaders = tableHeaders.filter(h => !excludedColumns.has(h));
            const displayHeaders = ['Thumbnail', ...filteredHeaders, 'Similarity Distance'];
            let table = `<table><thead><tr>${displayHeaders.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>`;
            table += trulySimilar.map(row => {
                const thumbnailCell = `<td class="thumbnail-cell"><img src="${THUMBNAILS_DIR}/${row.PerceptualHash}.jpg" alt="thumbnail" loading="lazy"></td>`;
                const dataCells = filteredHeaders.map(header => `<td>${row[header]}</td>`).join('');
                const distanceCell = `<td>${row.distance}</td>`;
                return `<tr>${thumbnailCell}${dataCells}${distanceCell}</tr>`;
            }).join('');
            table += '</tbody></table>';
            container.innerHTML = table;
        }

        function setupEventListeners() {
            const sidebar = document.getElementById('sidebar');
            const mainTableBody = document.getElementById('main-table-body');

            const clearSelection = () => {
                const selected = document.querySelector('.selected-row');
                if (selected) selected.classList.remove('selected-row');
            };

            document.getElementById('close-sidebar').addEventListener('click', () => {
                sidebar.classList.remove('visible');
                clearSelection();
            });

            mainTableBody.addEventListener('click', (event) => {
                if (event.target.classList.contains('similarity-link')) {
                    event.preventDefault();
                    clearSelection();
                    const rowElement = event.target.closest('tr');
                    rowElement.classList.add('selected-row');
                    
                    const path = event.target.dataset.path;
                    const sourceImage = fullDataset.find(item => item.FullPath === path);
                    const similarImages = similarityMap.get(path);
                    
                    renderSourceImageDetails(document.getElementById('sidebar-source-image'), sourceImage);
                    renderSimilarTable(document.getElementById('sidebar-similar-list'), sourceImage, similarImages);
                    sidebar.classList.add('visible');
                }
            });

            document.getElementById('apply-filters').addEventListener('click', applyFilters);
            document.getElementById('reset-filters').addEventListener('click', () => {
                document.getElementById('filter-bar').querySelectorAll('input, select').forEach(el => el.value = '');
                applyFilters();
            });

            document.getElementById('filter-bar').querySelectorAll('input').forEach(input => {
                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        applyFilters();
                    }
                });
            });
        }
    </script>
</body>
</html>
