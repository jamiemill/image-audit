<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalog Comparison</title>
    <script src="vendor/papaparse.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
        color: #212529;
      }
      header {
        background-color: #fff;
        padding: 1rem 2rem;
        border-bottom: 1px solid #dee2e6;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      h1 { margin: 0; font-size: 1.5rem; }
      #status { font-style: italic; color: #6c757d; }
      #controls {
        background-color: #f1f3f5;
        padding: 1rem 2rem;
        border-bottom: 1px solid #dee2e6;
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }
      #controls label { font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
      #controls input[type="number"] {
        width: 60px;
        padding: 0.375rem 0.5rem;
        font-size: 0.9rem;
        border: 1px solid #ced4da;
        border-radius: 0.25rem;
      }
      #controls button {
        padding: 0.5rem 1.25rem;
        font-size: 0.9rem;
        border-radius: 0.25rem;
        border: 1px solid #007bff;
        background-color: #007bff;
        color: white;
        cursor: pointer;
      }
      #controls button:disabled {
        background-color: #6c757d;
        border-color: #6c757d;
        cursor: not-allowed;
      }
      #progress-bar-wrap {
        flex: 1;
        background: #dee2e6;
        border-radius: 4px;
        height: 8px;
        display: none;
      }
      #progress-bar {
        height: 8px;
        background: #007bff;
        border-radius: 4px;
        width: 0%;
        transition: width 0.2s;
      }
      main { padding: 2rem; }
      #summary {
        margin-bottom: 1rem;
        font-size: 0.9rem;
        color: #495057;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background-color: #fff;
        box-shadow: 0 0 1rem rgba(0,0,0,0.05);
      }
      th, td {
        padding: 0.75rem 1rem;
        text-align: left;
        border-bottom: 1px solid #dee2e6;
        vertical-align: middle;
        font-size: 0.85rem;
      }
      th {
        background-color: #f8f9fa;
        font-weight: 600;
        white-space: nowrap;
      }
      th.side-header {
        background-color: #e9ecef;
        text-align: center;
        font-size: 0.95rem;
      }
      td.thumbnail-cell img {
        max-width: 80px;
        max-height: 80px;
        border-radius: 4px;
        display: block;
      }
      td.distance-cell {
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        white-space: nowrap;
      }
      td.distance-cell.exact { color: #c0392b; }
      td.distance-cell.very-close { color: #e67e22; }
      td.distance-cell.similar { color: #27ae60; }
      tr.group-start td { border-top: 2px solid #adb5bd; }
      td[rowspan] { background-color: #f8f9fa; vertical-align: top; }
      td.path-cell {
        max-width: 200px;
        word-break: break-all;
        font-size: 0.8rem;
        color: #6c757d;
      }
      td.name-cell { white-space: nowrap; font-weight: 500; }
      #pagination-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        gap: 0.5rem;
      }
      #pagination-controls button, #pagination-controls span {
        padding: 0.5rem 0.75rem;
        border: 1px solid #dee2e6;
        background-color: #fff;
        border-radius: 0.25rem;
      }
      #pagination-controls button:not([disabled]) { cursor: pointer; }
      #pagination-controls button:disabled { color: #adb5bd; background-color: #e9ecef; }
    </style>
  </head>
  <body>
    <header>
      <h1>Catalog Comparison</h1>
      <div id="status">Loading config...</div>
    </header>

    <div id="controls">
      <label>
        Similarity threshold:
        <input type="number" id="threshold" value="10" min="0" max="64" />
        <span style="color:#6c757d; font-size:0.8rem">(0 = identical, 64 = completely different)</span>
      </label>
      <button id="run-btn" disabled>Find Matches</button>
      <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    </div>

    <main>
      <div id="summary"></div>
      <table id="results-table" style="display:none">
        <thead>
          <tr id="side-headers"></tr>
          <tr id="col-headers"></tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <div id="pagination-controls"></div>
    </main>

    <script>
      const THUMBNAILS_DIR = "output/thumbnails";
      const GROUPS_PER_PAGE = 25;

      let leftData = [];
      let rightData = [];
      let leftIndex = new Map();
      let rightIndex = new Map();
      let leftLabel = "Left";
      let rightLabel = "Right";
      let allGroups = [];   // [{rowA, matches:[{rowB,distance}], bestDistance}]
      let currentPage = 1;
      let worker = null;

      function escHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function parseCSVStreaming(url) {
        return new Promise((resolve, reject) => {
          let rows = [];
          let fields = null;
          Papa.parse(url + "?t=" + Date.now(), {
            download: true,
            header: true,
            skipEmptyLines: true,
            chunk: (results) => {
              if (!fields && results.meta.fields) fields = results.meta.fields;
              rows = rows.concat(results.data);
            },
            complete: () => resolve({ data: rows, fields }),
            error: reject,
          });
        });
      }

      function toHashPairs(dataset) {
        return dataset
          .filter(r => r.PerceptualHash && r.PerceptualHash !== "N/A" && r.PerceptualHash.length === 16)
          .map(r => [
            r.FullPath,
            parseInt(r.PerceptualHash.slice(0, 8), 16) >>> 0,
            parseInt(r.PerceptualHash.slice(8, 16), 16) >>> 0,
          ]);
      }

      async function loadSide(config) {
        let rows = [];
        for (const csvPath of config.csv_files) {
          const { data } = await parseCSVStreaming(csvPath);
          rows = rows.concat(data);
        }
        return rows;
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const statusEl = document.getElementById("status");
        const runBtn = document.getElementById("run-btn");

        try {
          const resp = await fetch("compare_config.json?t=" + Date.now());
          if (!resp.ok) throw new Error("compare_config.json not found");
          const config = await resp.json();

          leftLabel = config.left.label || "Left";
          rightLabel = config.right.label || "Right";
          document.getElementById("threshold").value = config.threshold ?? 10;

          statusEl.textContent = `Loading ${leftLabel}...`;
          leftData = await loadSide(config.left);
          leftIndex = new Map(leftData.map(r => [r.FullPath, r]));

          statusEl.textContent = `Loading ${rightLabel}...`;
          rightData = await loadSide(config.right);
          rightIndex = new Map(rightData.map(r => [r.FullPath, r]));

          const leftHashes = toHashPairs(leftData).length;
          const rightHashes = toHashPairs(rightData).length;

          statusEl.textContent =
            `Loaded ${leftData.length.toLocaleString()} from ${leftLabel}, ` +
            `${rightData.length.toLocaleString()} from ${rightLabel}. ` +
            `Ready to compare (${leftHashes.toLocaleString()} × ${rightHashes.toLocaleString()} hash pairs).`;

          runBtn.disabled = false;
        } catch (e) {
          statusEl.textContent = `Error: ${e.message}`;
          console.error(e);
        }

        runBtn.addEventListener("click", runComparison);
      });

      function runComparison() {
        const threshold = parseInt(document.getElementById("threshold").value);
        const statusEl = document.getElementById("status");
        const runBtn = document.getElementById("run-btn");
        const progressWrap = document.getElementById("progress-bar-wrap");
        const progressBar = document.getElementById("progress-bar");

        runBtn.disabled = true;
        progressWrap.style.display = "block";
        progressBar.style.width = "0%";
        document.getElementById("summary").textContent = "";
        document.getElementById("results-table").style.display = "none";
        document.getElementById("results-body").innerHTML = "";
        document.getElementById("pagination-controls").innerHTML = "";
        statusEl.textContent = "Computing cross-catalog similarity...";

        if (worker) worker.terminate();
        worker = new Worker("compare_worker.js");

        const hashPairsA = toHashPairs(leftData);
        const hashPairsB = toHashPairs(rightData);

        worker.postMessage({ hashPairsA, hashPairsB, threshold });

        worker.onmessage = (event) => {
          if (event.data.type === "progress") {
            progressBar.style.width = event.data.percent + "%";
            statusEl.textContent = `Computing... ${event.data.percent}%`;
            return;
          }
          if (event.data.type === "complete") {
            progressWrap.style.display = "none";
            const rawMatches = event.data.matches;

            // Group by left image path; rawMatches already sorted by distance asc
            const groupMap = new Map();
            for (const [pathA, pathB, distance] of rawMatches) {
              const rowA = leftIndex.get(pathA);
              const rowB = rightIndex.get(pathB);
              if (!rowA || !rowB) continue;
              if (!groupMap.has(pathA)) groupMap.set(pathA, { rowA, matches: [], bestDistance: distance });
              groupMap.get(pathA).matches.push({ rowB, distance });
            }
            // Sort groups by best (lowest) distance, then by left path for stability
            allGroups = Array.from(groupMap.values())
              .sort((a, b) => a.bestDistance - b.bestDistance || (a.rowA.FullPath > b.rowA.FullPath ? 1 : -1));

            const totalMatches = allGroups.reduce((s, g) => s + g.matches.length, 0);
            currentPage = 1;
            renderResults();
            statusEl.textContent =
              `Found ${totalMatches.toLocaleString()} match${totalMatches !== 1 ? "es" : ""} ` +
              `across ${allGroups.length.toLocaleString()} ${leftLabel} image${allGroups.length !== 1 ? "s" : ""} ` +
              `at threshold ≤ ${threshold}.`;
            runBtn.disabled = false;
          }
        };

        worker.onerror = (e) => {
          statusEl.textContent = `Worker error: ${e.message}`;
          runBtn.disabled = false;
          progressWrap.style.display = "none";
        };
      }

      function renderResults() {
        const table = document.getElementById("results-table");
        const sideHeaders = document.getElementById("side-headers");
        const colHeaders = document.getElementById("col-headers");
        const tbody = document.getElementById("results-body");

        if (allGroups.length === 0) {
          document.getElementById("summary").textContent = "No matches found. Try increasing the threshold.";
          table.style.display = "none";
          document.getElementById("pagination-controls").innerHTML = "";
          return;
        }

        const totalMatches = allGroups.reduce((s, g) => s + g.matches.length, 0);
        document.getElementById("summary").textContent =
          `${totalMatches.toLocaleString()} matches across ${allGroups.length.toLocaleString()} ${leftLabel} images — sorted by best similarity.`;

        sideHeaders.innerHTML =
          `<th class="side-header" colspan="3">${escHtml(leftLabel)}</th>` +
          `<th class="side-header" colspan="4">${escHtml(rightLabel)}</th>`;

        colHeaders.innerHTML =
          `<th>Thumb</th><th>Filename</th><th>Path</th>` +
          `<th style="text-align:center">⇔</th>` +
          `<th>Thumb</th><th>Filename</th><th>Path</th>`;

        const startIndex = (currentPage - 1) * GROUPS_PER_PAGE;
        const pageGroups = allGroups.slice(startIndex, startIndex + GROUPS_PER_PAGE);

        tbody.innerHTML = pageGroups.map(({ rowA, matches }) => {
          const span = matches.length;
          const pathA = rowA.FullPath || "";
          const nameA = rowA.FileName || pathA.split("/").pop();
          const dirA = pathA.split("/").slice(0, -1).slice(-2).join("/");
          const thumbA = rowA.SHA256 && rowA.SHA256 !== "N/A"
            ? `<img src="${THUMBNAILS_DIR}/${escHtml(rowA.SHA256)}.webp" loading="lazy">`
            : "";

          return matches.map(({ rowB, distance }, i) => {
            const distClass = distance === 0 ? "exact" : distance <= 5 ? "very-close" : "similar";
            const pathB = rowB.FullPath || "";
            const nameB = rowB.FileName || pathB.split("/").pop();
            const dirB = pathB.split("/").slice(0, -1).slice(-2).join("/");
            const thumbB = rowB.SHA256 && rowB.SHA256 !== "N/A"
              ? `<img src="${THUMBNAILS_DIR}/${escHtml(rowB.SHA256)}.webp" loading="lazy">`
              : "";

            if (i === 0) {
              return `<tr class="group-start">
                <td class="thumbnail-cell" rowspan="${span}">${thumbA}</td>
                <td class="name-cell" rowspan="${span}">${escHtml(nameA)}</td>
                <td class="path-cell" rowspan="${span}" title="${escHtml(pathA)}">${escHtml(dirA)}</td>
                <td class="distance-cell ${distClass}">${distance}</td>
                <td class="thumbnail-cell">${thumbB}</td>
                <td class="name-cell">${escHtml(nameB)}</td>
                <td class="path-cell" title="${escHtml(pathB)}">${escHtml(dirB)}</td>
              </tr>`;
            }
            return `<tr>
              <td class="distance-cell ${distClass}">${distance}</td>
              <td class="thumbnail-cell">${thumbB}</td>
              <td class="name-cell">${escHtml(nameB)}</td>
              <td class="path-cell" title="${escHtml(pathB)}">${escHtml(dirB)}</td>
            </tr>`;
          }).join("");
        }).join("");

        table.style.display = "";
        renderPagination();
      }

      function renderPagination() {
        const controls = document.getElementById("pagination-controls");
        const totalPages = Math.ceil(allGroups.length / GROUPS_PER_PAGE);
        if (totalPages <= 1) { controls.innerHTML = ""; return; }
        controls.innerHTML =
          `<button data-page="1" ${currentPage === 1 ? "disabled" : ""}>&laquo; First</button>` +
          `<button data-page="${currentPage - 1}" ${currentPage === 1 ? "disabled" : ""}>&lsaquo; Prev</button>` +
          `<span>Page ${currentPage} of ${totalPages}</span>` +
          `<button data-page="${currentPage + 1}" ${currentPage === totalPages ? "disabled" : ""}>Next &rsaquo;</button>` +
          `<button data-page="${totalPages}" ${currentPage === totalPages ? "disabled" : ""}>Last &raquo;</button>`;
        controls.querySelectorAll("button[data-page]").forEach(btn => {
          btn.addEventListener("click", () => {
            const p = parseInt(btn.dataset.page);
            if (p && p !== currentPage) {
              currentPage = p;
              renderResults();
              window.scrollTo(0, 0);
            }
          });
        });
      }
    </script>
  </body>
</html>
